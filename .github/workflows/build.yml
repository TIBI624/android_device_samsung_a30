name: Evolution X Build

on:
  workflow_dispatch:
  push:
    branches: [ android-16 ]

env:
  DEVICE: a30
  ROM: evolution_x

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        device: [a30]
    
    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/samsung/a30

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk git gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig img2simg python3 python3-pip aria2 ccache libssl-dev repo
        git config --global user.email "tib624@example.com"
        git config --global user.name "TIBI624"

    - name: Initialize Evolution X Repo
      run: |
        mkdir workspace
        cd workspace
        repo init -u https://github.com/Evolution-X/manifest.git -b fourteen
        mkdir -p .repo/local_manifests
        cp ../device/samsung/a30/local_manifest.xml .repo/local_manifests/
        repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc --all)

    - name: Setup Environment and Lunch
      run: |
        cd workspace
        source build/envsetup.sh
        lunch evolution_a30-userdebug

    - name: Build Boot Image
      run: |
        cd workspace
        mka bootimage -j$(nproc --all)
        mkdir -p artifacts
        cp out/target/product/a30/boot.img artifacts/

    - name: Build Recovery Image
      run: |
        cd workspace
        mka recoveryimage -j$(nproc --all)
        cp out/target/product/a30/recovery.img artifacts/

    - name: Upload Boot Image
      uses: actions/upload-artifact@v4
      with:
        name: bootimage-${{ matrix.device }}
        path: workspace/artifacts/boot.img

    - name: Upload Recovery Image
      uses: actions/upload-artifact@v4
      with:
        name: recoveryimage-${{ matrix.device }}
        path: workspace/artifacts/recovery.img

    - name: Build Full ROM (Optional)
      continue-on-error: true
      run: |
        cd workspace
        mka bacon -j$(nproc --all)
        cp out/target/product/a30/EvolutionX-*.zip artifacts/

    - name: Upload ROM
      uses: actions/upload-artifact@v4
      with:
        name: evolutionx-${{ matrix.device }}
        path: workspace/artifacts/EvolutionX-*.zip
      if: success() && hashFiles('workspace/artifacts/EvolutionX-*.zip') != ''
