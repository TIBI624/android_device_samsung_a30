# =============================================================================
# Cirrus CI Configuration for Samsung A30 Device Tree (Evolution X / Android 16)
# =============================================================================

env:
  CIRRUS_CLONE_DEPTH: 1
  CCACHE_DIR: /tmp/ccache
  USE_CCACHE: 1
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 6
  CCACHE_MAXSIZE: "2G"
  DEVICE: a30
  ROM_TARGET: evolution_a30-userdebug

ccache_cache:
  folder: $CCACHE_DIR
  fingerprint_script: cat device/samsung/a30/Android.mk device/samsung/a30/BoardConfig.mk device/samsung/a30/device.mk 2>/dev/null || echo "fallback"

task:
  name: "Build Evolution X for A30"
  only_if: $CIRRUS_BRANCH == 'android-16' || $CIRRUS_PULL_REQUEST != ''
  timeout_in: 180m

  container:
    image: ghcr.io/cirruslabs/android-sdk:35
    cpu: 8
    memory: 16G
    disk: 100G

  install_deps_script:
    - sudo apt-get update -qq
    - sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev repo python3 python3-pip aria2 wget
    - git config --global user.email "ci@tib624.dev"
    - git config --global user.name "Cirrus CI"

  sync_script:
    - mkdir -p ~/android && cd ~/android
    - repo init -u https://github.com/Evolution-X/manifest.git -b vic
    # Update repo to latest version to avoid known bugs
    - cp .repo/repo/repo /usr/bin/repo
    - chmod a+x /usr/bin/repo
    - mkdir -p .repo/local_manifests
    - cp $CIRRUS_WORKING_DIR/local_manifest.xml .repo/local_manifests/a30.xml
    # Clean broken Chromium WebView projects that cause "Cannot initialize work tree"
    - rm -rf external/chromium-webview/prebuilt/arm
    - rm -rf external/chromium-webview/prebuilt/arm64
    - rm -rf external/chromium-webview/prebuilt/x86
    - rm -rf .repo/projects/external/chromium-webview/prebuilt/arm.git
    - rm -rf .repo/projects/external/chromium-webview/prebuilt/arm64.git
    - rm -rf .repo/projects/external/chromium-webview/prebuilt/x86.git
    - rm -rf .repo/project-objects/LineageOS/android_external_chromium-webview_prebuilt_arm.git
    - rm -rf .repo/project-objects/LineageOS/android_external_chromium-webview_prebuilt_arm64.git
    - rm -rf .repo/project-objects/LineageOS/android_external_chromium-webview_prebuilt_x86.git
    # Full sync
    - repo sync -c --force-sync --optimized-fetch --no-tags --no-clone-bundle --prune -j$(nproc)

  build_script:
    - cd ~/android
    - source build/envsetup.sh
    - lunch $ROM_TARGET
    - mka bootimage -j8
    - mka recoveryimage -j8
    - mka bacon -j8

  bootimage_artifacts:
    path: "~/android/out/target/product/a30/boot.img"
    type: application/octet-stream

  recoveryimage_artifacts:
    path: "~/android/out/target/product/a30/recovery.img"
    type: application/octet-stream

  rom_artifacts:
    path: "~/android/out/target/product/a30/EvolutionX-*.zip"
    type: application/zip

  before_cache_script:
    - find $CCACHE_DIR -name "*.o" -mtime +7 -delete 2>/dev/null || true
    - find $CCACHE_DIR -name "*.gcda" -delete 2>/dev/null || true